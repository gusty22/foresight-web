<div class="container-fluid p-4">
  <div class="row g-4">

    <div class="col-md-5">
      <div class="card border-0 shadow-sm p-4 rounded-4 bg-white border-top border-5 border-success">
        <h4 class="fw-bold mb-4">Nova Empresa</h4>
        <form (submit)="salvarEmpresa()">
          <div class="mb-3">
            <label class="form-label small fw-bold">Nome da Empresa</label>
            <input type="text" [(ngModel)]="novaEmpresa.nome" name="nome" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Tipo de Negócio</label>
            <select [(ngModel)]="novaEmpresa.tipo" name="tipo" class="form-select">
              <option value="SERVICO">Prestação de Serviço</option>
              <option value="COMERCIO">Comércio / Vendas</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-bold">Pró-labore Desejado (R$)</label>
            <input type="number" [(ngModel)]="novaEmpresa.proLaboreDesejado" name="prolabore" class="form-control">
          </div>
          <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm" [disabled]="loading()">
            {{ loading() ? 'Salvando...' : 'Cadastrar Empresa' }}
          </button>
        </form>
      </div>
    </div>

    <div class="col-md-7">
      <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
        <h5 class="fw-bold mb-4">Minhas Empresas Vinculadas</h5>

        <div class="row g-3">
          <div class="col-12" *ngFor="let emp of listaDeEmpresas()">
            <div class="p-3 border rounded-3 d-flex justify-content-between align-items-center hover-shadow transition">
              <div>
                <h6 class="fw-bold mb-0 text-dark">{{ emp.nome }}</h6>
                <small class="text-muted">{{ emp.tipo }} | Pró-labore: {{ emp.proLaboreDesejado | currency:'BRL' }}</small>
              </div>
              <span class="badge bg-success-subtle text-success rounded-pill">ID: #{{ emp.id }}</span>
            </div>
          </div>

          <div *ngIf="listaDeEmpresas().length === 0" class="text-center py-5">
            <i class="bi bi-building text-muted fs-1"></i>
            <p class="text-muted mt-2">Você ainda não cadastrou nenhuma empresa.</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
